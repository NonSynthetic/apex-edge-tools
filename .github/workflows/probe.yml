name: datacenter-probe
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: single-request cold test (fresh runner IP, NO sweep)
        run: |
          echo "=== exactly ONE request: is a cold IP challenged? ==="
          curl -sS -o /tmp/b.out -w "code=%{http_code} size=%{size_download}\n" --max-time 15 "https://api.nonsynthetic.net/llms.txt"
          head -c 300 /tmp/b.out; echo
          sleep 30
          echo "=== after 30s pause, one more: adaptive or standing? ==="
          curl -sS -o /tmp/b2.out -w "code=%{http_code} size=%{size_download}\n" --max-time 15 "https://api.nonsynthetic.net/v1/models"
          head -c 200 /tmp/b2.out; echo
