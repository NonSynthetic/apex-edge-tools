name: datacenter-probe
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in /openapi.json /.well-known/x402 /.well-known/agent.json /.well-known/mcp.json /llms.txt /ai.txt /api/v1/board/tasks /api/v1/free/describe /robots.txt /sitemap.xml /start.html /earn.html; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "https://api.nonsynthetic.net$p"); echo "api  $code  $p"
          done
          for p in /openapi.json /robots.txt /sitemap.xml /; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "https://nonsynthetic.net$p"); echo "www  $code  $p"
          done
