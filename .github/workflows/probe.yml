name: datacenter-probe
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== 403 body ==="
          curl -sS --max-time 20 https://api.nonsynthetic.net/openapi.json | head -c 2000
          echo
          echo "=== headers ==="
          curl -sSI --max-time 20 https://api.nonsynthetic.net/openapi.json | head -20
          echo "=== well-known body (works) ==="
          curl -sS --max-time 20 https://api.nonsynthetic.net/.well-known/x402 | head -c 200
